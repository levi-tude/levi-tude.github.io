<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Migracao gradual Sheets para Supabase</title>
  <desc id="desc">Fluxo conceitual da migracao: Google Sheets legado, parsers e regras no backend, PostgreSQL/Supabase como fonte primaria, e convivencia controlada ate a equipe consolidar o uso do painel.</desc>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f7f7a"/>
    </marker>
  </defs>
  <rect width="840" height="420" rx="12" fill="#f7fafb"/>
  <text x="28" y="34" fill="#0a1620" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Migracao gradual: Sheets -&gt; Supabase</text>
  <text x="28" y="54" fill="#5a717c" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Sem valores, nomes reais ou IDs - so o desenho do fluxo</text>

  <rect x="28" y="90" width="180" height="120" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="44" y="122" fill="#0a1620" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">1. Legado</text>
  <text x="44" y="146" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Google Sheets</text>
  <text x="44" y="166" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">alunos / pagamentos</text>
  <text x="44" y="186" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">caixa operacional</text>

  <path d="M208 150 H250" stroke="#0f7f7a" stroke-width="1.75" fill="none" marker-end="url(#m)"/>

  <rect x="250" y="90" width="200" height="120" rx="10" fill="#e6f5f3" stroke="#0f7f7a" stroke-width="1.5"/>
  <text x="266" y="122" fill="#0a1620" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">2. Backend</text>
  <text x="266" y="146" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Parsers + regras</text>
  <text x="266" y="166" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">de dominio</text>
  <text x="266" y="186" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">sync controlado</text>

  <path d="M450 150 H492" stroke="#0f7f7a" stroke-width="1.75" fill="none" marker-end="url(#m)"/>

  <rect x="492" y="90" width="200" height="120" rx="10" fill="#e6f5f3" stroke="#0f7f7a" stroke-width="1.5"/>
  <text x="508" y="122" fill="#0a1620" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">3. Fonte primaria</text>
  <text x="508" y="146" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Supabase / PostgreSQL</text>
  <text x="508" y="166" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Auth / RLS / tabelas</text>
  <text x="508" y="186" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">do painel</text>

  <path d="M692 150 H734" stroke="#0f7f7a" stroke-width="1.75" fill="none" marker-end="url(#m)"/>

  <rect x="734" y="90" width="78" height="120" rx="10" fill="#f0f7f8" stroke="#0c3b47" stroke-width="1.5"/>
  <text x="746" y="140" fill="#0a1620" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">4. UI</text>
  <text x="746" y="162" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Painel</text>
  <text x="746" y="180" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="10">React</text>

  <rect x="28" y="250" width="784" height="140" rx="10" fill="#ffffff" stroke="#d7e3e7" stroke-width="1.5"/>
  <text x="48" y="286" fill="#0a1620" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Como a migracao acontece na pratica</text>
  <text x="48" y="314" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">- Reaproveitamento de parsers e regras ja usadas na planilha</text>
  <text x="48" y="338" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">- Convivencia controlada planilha + sistema ate a equipe consolidar o uso</text>
  <text x="48" y="362" fill="#243642" font-family="Segoe UI, system-ui, sans-serif" font-size="11">- Migracao progressiva - nao e big bang nem 100% concluida</text>
  <text x="48" y="386" fill="#5a717c" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Seguranca: secretaria nao ve extrato oficial; admin acessa financeiro completo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Migracao gradual Sheets para Supabase</title>
  <desc id="desc">Fluxo conceitual da migracao: Google Sheets legado, parsers e regras no backend, PostgreSQL/Supabase como fonte primaria, e convivencia controlada ate a equipe consolidar o uso do painel.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f7fafb; }
      .title { font: 700 18px system-ui, Segoe UI, sans-serif; fill: #0a1620; }
      .subtitle { font: 500 12px system-ui, Segoe UI, sans-serif; fill: #5a717c; }
      .box-title { font: 700 13px system-ui, Segoe UI, sans-serif; fill: #0a1620; }
      .box-sub { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #243642; }
      .label-muted { font: 500 10px system-ui, Segoe UI, sans-serif; fill: #5a717c; }
      .arrow { stroke-width: 1.75; fill: none; marker-end: url(#m); stroke: #0f7f7a; }
      .panel { stroke-width: 1.5; rx: 10; }
    ]]></style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f7f7a"/>
    </marker>
  </defs>

  <rect class="bg" width="840" height="420" rx="12"/>
  <text class="title" x="28" y="34">Migracao gradual: Sheets ’ Supabase</text>
  <text class="subtitle" x="28" y="54">Sem valores, nomes reais ou IDs · so o desenho do fluxo</text>

  <rect class="panel" x="28" y="90" width="180" height="120" rx="10" fill="#fff7ed" stroke="#b45309" stroke-dasharray="5 3"/>
  <text class="box-title" x="44" y="122">1. Legado</text>
  <text class="box-sub" x="44" y="146">Google Sheets</text>
  <text class="box-sub" x="44" y="166">alunos · pagamentos</text>
  <text class="box-sub" x="44" y="186">caixa operacional</text>

  <path class="arrow" d="M208 150 H250"/>

  <rect class="panel" x="250" y="90" width="200" height="120" rx="10" fill="#e6f5f3" stroke="#0f7f7a"/>
  <text class="box-title" x="266" y="122">2. Backend</text>
  <text class="box-sub" x="266" y="146">Parsers + regras</text>
  <text class="box-sub" x="266" y="166">de dominio</text>
  <text class="box-sub" x="266" y="186">sync controlado</text>

  <path class="arrow" d="M450 150 H492"/>

  <rect class="panel" x="492" y="90" width="200" height="120" rx="10" fill="#e6f5f3" stroke="#0f7f7a"/>
  <text class="box-title" x="508" y="122">3. Fonte primaria</text>
  <text class="box-sub" x="508" y="146">Supabase / PostgreSQL</text>
  <text class="box-sub" x="508" y="166">Auth · RLS · tabelas</text>
  <text class="box-sub" x="508" y="186">do painel</text>

  <path class="arrow" d="M692 150 H734"/>

  <rect class="panel" x="734" y="90" width="78" height="120" rx="10" fill="#f0f7f8" stroke="#0c3b47"/>
  <text class="box-title" x="746" y="140" style="font-size:11px">4. UI</text>
  <text class="box-sub" x="746" y="162" style="font-size:10px">Painel</text>
  <text class="box-sub" x="746" y="180" style="font-size:10px">React</text>

  <rect x="28" y="250" width="784" height="140" rx="10" fill="#ffffff" stroke="#d7e3e7" stroke-width="1.5"/>
  <text class="box-title" x="48" y="286">Como a migracao acontece na pratica</text>
  <text class="box-sub" x="48" y="314">" Reaproveitamento de parsers e regras ja usadas na planilha</text>
  <text class="box-sub" x="48" y="338">" Convivencia controlada planilha + sistema ate a equipe consolidar o uso</text>
  <text class="box-sub" x="48" y="362">" Migracao progressiva  nao e big bang nem 100% concluida</text>
  <text class="label-muted" x="48" y="386">Seguranca: secretaria nao ve extrato oficial; admin acessa financeiro completo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do sistema Byla</title>
  <desc id="desc">Fluxo: frontend React/TypeScript na Vercel, backend Node.js/Express no Render, armazenamento primário Supabase/PostgreSQL, Google Sheets como legado em migração, e automações n8n. Auth e perfil vão direto do frontend ao Supabase.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke-width: 1.5; }
      .panel-atual { stroke: #0f766e; }
      .panel-legado { stroke: #b45309; stroke-dasharray: 5 3; }
      .panel-auto { stroke: #6d28d9; }
      .panel-host { stroke: #334155; fill: #f1f5f9; }
      .title { font: 700 18px system-ui, Segoe UI, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #64748b; }
      .box-title { font: 700 13px system-ui, Segoe UI, sans-serif; fill: #0f172a; }
      .box-sub { font: 500 10.5px system-ui, Segoe UI, sans-serif; fill: #475569; }
      .label { font: 600 10px system-ui, Segoe UI, sans-serif; fill: #334155; }
      .label-muted { font: 500 9.5px system-ui, Segoe UI, sans-serif; fill: #64748b; }
      .legend { font: 500 10px system-ui, Segoe UI, sans-serif; fill: #334155; }
      .arrow { stroke-width: 1.75; fill: none; marker-end: url(#m); }
      .a-atual { stroke: #0f766e; }
      .a-auth { stroke: #0369a1; stroke-dasharray: 4 3; }
      .a-legado { stroke: #b45309; stroke-dasharray: 5 3; }
      .a-auto { stroke: #6d28d9; }
      .badge { font: 700 9px system-ui, Segoe UI, sans-serif; }
      .badge-admin { fill: #1e3a5f; }
      .badge-sec { fill: #14532d; }
      .badge-txt { fill: #ffffff; }
    ]]></style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="840" height="540" rx="12"/>

  <text class="title" x="28" y="34">Arquitetura Byla</text>
  <text class="subtitle" x="28" y="52">Operações escolares · migração gradual · papéis distintos</text>

  <!-- Legend -->
  <g transform="translate(420, 22)">
    <rect x="0" y="0" width="14" height="10" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text class="legend" x="20" y="9">Sistema atual</text>
    <rect x="110" y="0" width="14" height="10" rx="2" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text class="legend" x="130" y="9">Legado</text>
    <rect x="190" y="0" width="14" height="10" rx="2" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text class="legend" x="210" y="9">Automações</text>
    <rect x="300" y="0" width="36" height="12" rx="6" class="badge-admin"/>
    <text class="badge badge-txt" x="307" y="9">Admin</text>
    <rect x="348" y="0" width="52" height="12" rx="6" class="badge-sec"/>
    <text class="badge badge-txt" x="354" y="9">Secretaria</text>
  </g>

  <!-- Frontend -->
  <g transform="translate(28, 78)">
    <rect class="panel panel-atual" width="220" height="118" rx="10" fill="#f0fdfa"/>
    <text class="box-title" x="16" y="28">Frontend</text>
    <text class="box-sub" x="16" y="48">React · TypeScript</text>
    <text class="box-sub" x="16" y="66">UI de operação e finanças</text>
    <rect x="16" y="80" width="72" height="22" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
    <text class="label" x="28" y="95">Vercel</text>
    <g transform="translate(100, 82)">
      <rect width="40" height="18" rx="9" class="badge-admin"/>
      <text class="badge badge-txt" x="7" y="13">Admin</text>
      <rect x="46" width="56" height="18" rx="9" class="badge-sec"/>
      <text class="badge badge-txt" x="52" y="13">Secretaria</text>
    </g>
  </g>

  <!-- Backend -->
  <g transform="translate(310, 78)">
    <rect class="panel panel-atual" width="220" height="118" rx="10" fill="#f0fdfa"/>
    <text class="box-title" x="16" y="28">Backend</text>
    <text class="box-sub" x="16" y="48">Node.js · Express</text>
    <text class="box-sub" x="16" y="66">Regras de negócio e APIs</text>
    <rect x="16" y="80" width="72" height="22" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
    <text class="label" x="30" y="95">Render</text>
  </g>

  <!-- Supabase -->
  <g transform="translate(592, 78)">
    <rect class="panel panel-atual" width="220" height="118" rx="10" fill="#f0fdfa"/>
    <text class="box-title" x="16" y="28">Armazenamento</text>
    <text class="box-sub" x="16" y="48">Supabase · PostgreSQL</text>
    <text class="box-sub" x="16" y="66">Fonte primária de dados</text>
    <text class="label-muted" x="16" y="96">Auth · perfil · domínio</text>
  </g>

  <!-- Main arrows: FE -> BE -> DB -->
  <path class="arrow a-atual" d="M248 130 H302"/>
  <text class="label-muted" x="250" y="118">ops de negócio</text>
  <path class="arrow a-atual" d="M530 130 H584"/>
  <text class="label-muted" x="532" y="118">persistência</text>

  <!-- Auth direct path -->
  <path class="arrow a-auth" d="M138 196 V230 H702 V196"/>
  <text class="label" x="300" y="224" fill="#0369a1">Auth / perfil (só direto ao Supabase)</text>

  <!-- Google Sheets legacy -->
  <g transform="translate(310, 268)">
    <rect class="panel panel-legado" width="220" height="100" rx="10" fill="#fff7ed"/>
    <text class="box-title" x="16" y="28">Google Sheets</text>
    <text class="box-sub" x="16" y="48">Legado em migração gradual</text>
    <text class="box-sub" x="16" y="66">Leitura/escrita controlada</text>
    <text class="label-muted" x="16" y="88">via backend · sem UI direta</text>
  </g>
  <path class="arrow a-legado" d="M420 196 V268"/>
  <text class="label-muted" x="430" y="240">ponte legado</text>

  <!-- n8n -->
  <g transform="translate(28, 268)">
    <rect class="panel panel-auto" width="220" height="100" rx="10" fill="#f5f3ff"/>
    <text class="box-title" x="16" y="28">Automações n8n</text>
    <text class="box-sub" x="16" y="48">Jobs · sync · relatórios</text>
    <text class="box-sub" x="16" y="66">Integrações periódicas</text>
    <text class="label-muted" x="16" y="88">fora do app interativo</text>
  </g>
  <path class="arrow a-auto" d="M248 318 H310"/>
  <path class="arrow a-auto" d="M138 368 V400 H702 V196" opacity="0.85"/>
  <text class="label-muted" x="250" y="392" fill="#6d28d9">sync com store / legado</text>

  <!-- Access note -->
  <g transform="translate(28, 430)">
    <rect width="784" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="box-title" x="20" y="28">Acesso por perfil (camada de app)</text>
    <text class="box-sub" x="20" y="50">Secretaria  fluxo operacional, aluguel de salas e perfil</text>
    <text class="box-sub" x="20" y="70">Admin  finanças, validação, calendário, relatórios, visão geral + rotas da secretaria</text>
    <g transform="translate(560, 20)">
      <rect width="90" height="22" rx="11" class="badge-sec"/>
      <text class="badge badge-txt" x="14" y="15">Secretaria</text>
      <rect y="32" width="90" height="22" rx="11" class="badge-admin"/>
      <text class="badge badge-txt" x="28" y="47">Admin</text>
    </g>
  </g>
</svg>

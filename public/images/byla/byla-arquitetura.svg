<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do sistema Byla Financeiro</title>
  <desc id="desc">Fluxo: frontend React/TypeScript na Vercel, backend Node.js/Express no Render, armazenamento Supabase/PostgreSQL, Google Sheets como legado em migracao, e automacoes n8n. Auth e perfil do frontend ao Supabase.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f7fafb; }
      .panel { fill: #ffffff; stroke-width: 1.5; }
      .panel-atual { stroke: #0f7f7a; fill: #e6f5f3; }
      .panel-legado { stroke: #b45309; fill: #fff7ed; stroke-dasharray: 5 3; }
      .panel-auto { stroke: #0c3b47; fill: #f0f7f8; }
      .title { font: 700 18px system-ui, Segoe UI, sans-serif; fill: #0a1620; }
      .subtitle { font: 500 12px system-ui, Segoe UI, sans-serif; fill: #5a717c; }
      .box-title { font: 700 13px system-ui, Segoe UI, sans-serif; fill: #0a1620; }
      .box-sub { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #243642; }
      .label { font: 600 11px system-ui, Segoe UI, sans-serif; fill: #243642; }
      .label-muted { font: 500 10px system-ui, Segoe UI, sans-serif; fill: #5a717c; }
      .legend { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #243642; }
      .arrow { stroke-width: 1.75; fill: none; marker-end: url(#m); }
      .a-atual { stroke: #0f7f7a; }
      .a-auth { stroke: #0369a1; stroke-dasharray: 4 3; }
      .a-legado { stroke: #b45309; stroke-dasharray: 5 3; }
      .a-auto { stroke: #0c3b47; }
      .badge-txt { fill: #ffffff; font: 700 9px system-ui, Segoe UI, sans-serif; }
    ]]></style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a717c"/>
    </marker>
  </defs>

  <rect class="bg" width="840" height="560" rx="12"/>

  <text class="title" x="28" y="34">Arquitetura Byla Financeiro</text>
  <text class="subtitle" x="28" y="54">Produto interno ? migracao gradual ? papeis distintos ? sem dados reais neste diagrama</text>

  <g transform="translate(380, 22)">
    <rect x="0" y="0" width="14" height="10" rx="2" fill="#e6f5f3" stroke="#0f7f7a" stroke-width="1.5"/>
    <text class="legend" x="20" y="9">Sistema atual</text>
    <rect x="118" y="0" width="14" height="10" rx="2" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text class="legend" x="138" y="9">Legado</text>
    <rect x="200" y="0" width="14" height="10" rx="2" fill="#f0f7f8" stroke="#0c3b47" stroke-width="1.5"/>
    <text class="legend" x="220" y="9">Automacoes</text>
    <rect x="310" y="0" width="40" height="14" rx="7" fill="#0c3b47"/>
    <text class="badge-txt" x="317" y="10">Admin</text>
    <rect x="358" y="0" width="58" height="14" rx="7" fill="#0f7f7a"/>
    <text class="badge-txt" x="365" y="10">Secretaria</text>
  </g>

  <g transform="translate(28, 80)">
    <rect class="panel panel-atual" width="220" height="120" rx="10"/>
    <text class="box-title" x="16" y="28">Frontend</text>
    <text class="box-sub" x="16" y="48">React + TypeScript</text>
    <text class="box-sub" x="16" y="66">UI operacional e financeira</text>
    <rect x="16" y="82" width="72" height="22" rx="6" fill="#ffffff" stroke="#0c3b47" stroke-width="1"/>
    <text class="label" x="30" y="97">Vercel</text>
    <rect x="100" y="84" width="40" height="18" rx="9" fill="#0c3b47"/>
    <text class="badge-txt" x="107" y="96">Admin</text>
    <rect x="146" y="84" width="58" height="18" rx="9" fill="#0f7f7a"/>
    <text class="badge-txt" x="153" y="96">Secretaria</text>
  </g>

  <g transform="translate(310, 80)">
    <rect class="panel panel-atual" width="220" height="120" rx="10"/>
    <text class="box-title" x="16" y="28">Backend</text>
    <text class="box-sub" x="16" y="48">Node.js + Express</text>
    <text class="box-sub" x="16" y="66">Regras de negocio e APIs</text>
    <text class="box-sub" x="16" y="84">JWT + RBAC</text>
    <rect x="16" y="96" width="72" height="18" rx="6" fill="#ffffff" stroke="#0c3b47" stroke-width="1"/>
    <text class="label" x="30" y="109">Render</text>
  </g>

  <g transform="translate(592, 80)">
    <rect class="panel panel-atual" width="220" height="120" rx="10"/>
    <text class="box-title" x="16" y="28">Armazenamento</text>
    <text class="box-sub" x="16" y="48">Supabase + PostgreSQL</text>
    <text class="box-sub" x="16" y="66">Fonte primaria de dados</text>
    <text class="label-muted" x="16" y="96">Auth ? perfil ? dominio ? RLS</text>
  </g>

  <path class="arrow a-atual" d="M248 140 H302"/>
  <text class="label-muted" x="252" y="128">API de negocio</text>
  <path class="arrow a-atual" d="M530 140 H584"/>
  <text class="label-muted" x="534" y="128">persistencia</text>

  <path class="arrow a-auth" d="M138 200 V236 H702 V200"/>
  <text class="label" x="290" y="230" fill="#0369a1">Auth / perfil (frontend ? Supabase)</text>

  <g transform="translate(28, 280)">
    <rect class="panel panel-auto" width="220" height="100" rx="10"/>
    <text class="box-title" x="16" y="28">Automacoes n8n</text>
    <text class="box-sub" x="16" y="48">Jobs ? sync ? relatorios</text>
    <text class="box-sub" x="16" y="66">Integracoes periodicas</text>
    <text class="label-muted" x="16" y="88">fora do app interativo</text>
  </g>

  <g transform="translate(310, 280)">
    <rect class="panel panel-legado" width="220" height="100" rx="10"/>
    <text class="box-title" x="16" y="28">Google Sheets</text>
    <text class="box-sub" x="16" y="48">Legado em migracao gradual</text>
    <text class="box-sub" x="16" y="66">Leitura/escrita controlada</text>
    <text class="label-muted" x="16" y="88">via backend ? sem UI direta</text>
  </g>

  <g transform="translate(592, 280)">
    <rect class="panel panel-atual" width="220" height="100" rx="10"/>
    <text class="box-title" x="16" y="28">Dominio (resumo)</text>
    <text class="box-sub" x="16" y="48">Alunos ? modalidades</text>
    <text class="box-sub" x="16" y="66">Pagamentos ? caixa</text>
    <text class="label-muted" x="16" y="88">sem valores ou PII neste desenho</text>
  </g>

  <path class="arrow a-auto" d="M248 330 H310"/>
  <path class="arrow a-legado" d="M420 200 V280"/>
  <text class="label-muted" x="430" y="250">ponte legado</text>
  <path class="arrow a-atual" d="M530 330 H584"/>

  <g transform="translate(28, 420)">
    <rect width="784" height="110" rx="10" fill="#ffffff" stroke="#d7e3e7" stroke-width="1.5"/>
    <text class="box-title" x="20" y="28">Acesso por perfil (camada de app)</text>
    <text class="box-sub" x="20" y="52">Secretaria ? fluxo operacional, aluguel de salas e perfil</text>
    <text class="box-sub" x="20" y="74">Admin ? financas, validacao, calendario, relatorios, visao geral + rotas da secretaria</text>
    <text class="label-muted" x="20" y="96">Diagrama conceitual para portfolio ? dados ficticios nas telas de UI</text>
    <rect x="560" y="24" width="90" height="22" rx="11" fill="#0f7f7a"/>
    <text class="badge-txt" x="574" y="39">Secretaria</text>
    <rect x="560" y="52" width="90" height="22" rx="11" fill="#0c3b47"/>
    <text class="badge-txt" x="588" y="67">Admin</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img" aria-labelledby="title desc">
  <title id="title">RBAC Byla ? Admin vs Secretaria</title>
  <desc id="desc">Comparativo de permissoes de navegacao: secretaria acessa fluxo operacional, aluguel de salas e perfil; admin acessa esses modulos mais financas, validacao, calendario, relatorios e visao geral.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f7fafb; }
      .title { font: 700 18px system-ui, Segoe UI, sans-serif; fill: #0a1620; }
      .subtitle { font: 500 12px system-ui, Segoe UI, sans-serif; fill: #5a717c; }
      .col-title { font: 700 14px system-ui, Segoe UI, sans-serif; fill: #ffffff; }
      .col-sub { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #e6f5f3; }
      .section { font: 700 10px system-ui, Segoe UI, sans-serif; fill: #5a717c; letter-spacing: 0.04em; }
      .item { font: 600 12px system-ui, Segoe UI, sans-serif; fill: #0a1620; }
      .hint { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #5a717c; }
      .card { fill: #ffffff; stroke: #d7e3e7; stroke-width: 1.25; }
      .pill-sec { fill: #e6f5f3; stroke: #0f7f7a; stroke-width: 1; }
      .pill-adm { fill: #f0f7f8; stroke: #0c3b47; stroke-width: 1; }
      .pill-shared { fill: #f7fafb; stroke: #5a717c; stroke-width: 1; }
      .hdr-sec { fill: #0f7f7a; }
      .hdr-adm { fill: #0c3b47; }
      .footer { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #5a717c; }
    ]]></style>
  </defs>

  <rect class="bg" width="840" height="520" rx="12"/>

  <text class="title" x="28" y="34">RBAC por perfil ? navegacao do app</text>
  <text class="subtitle" x="28" y="54">Rotas e menus por papel ? sem tokens, URLs internas ou politicas de banco</text>

  <g transform="translate(28, 72)">
    <rect width="380" height="400" rx="12" class="card"/>
    <rect width="380" height="56" rx="12" class="hdr-sec"/>
    <rect y="28" width="380" height="28" class="hdr-sec"/>
    <text class="col-title" x="20" y="28">Secretaria</text>
    <text class="col-sub" x="20" y="46">Fluxo operacional do dia a dia</text>

    <text class="section" x="20" y="84">OPERACAO</text>
    <rect class="pill-sec" x="20" y="96" width="340" height="36" rx="8"/>
    <text class="item" x="36" y="119">Fluxo de caixa (operacional)</text>
    <rect class="pill-sec" x="20" y="142" width="340" height="36" rx="8"/>
    <text class="item" x="36" y="165">Aluguel de salas</text>

    <text class="section" x="20" y="206">CONTA</text>
    <rect class="pill-sec" x="20" y="218" width="340" height="36" rx="8"/>
    <text class="item" x="36" y="241">Perfil</text>

    <text class="hint" x="20" y="290">Sem acesso a modulos financeiros</text>
    <text class="hint" x="20" y="308">oficiais, validacao gerencial,</text>
    <text class="hint" x="20" y="326">calendario, relatorios ou visao geral.</text>

    <rect x="20" y="348" width="340" height="36" rx="8" fill="#f7fafb" stroke="#d7e3e7"/>
    <text class="hint" x="36" y="370">Entrada padrao: fluxo operacional</text>
  </g>

  <g transform="translate(432, 72)">
    <rect width="380" height="400" rx="12" class="card"/>
    <rect width="380" height="56" rx="12" class="hdr-adm"/>
    <rect y="28" width="380" height="28" class="hdr-adm"/>
    <text class="col-title" x="20" y="28">Admin</text>
    <text class="col-sub" x="20" y="46">Gestao completa + rotas da secretaria</text>

    <text class="section" x="20" y="84">INCLUI SECRETARIA</text>
    <rect class="pill-shared" x="20" y="96" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="115" style="font-size:11px">Fluxo de caixa</text>
    <rect class="pill-shared" x="194" y="96" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="115" style="font-size:11px">Aluguel / Perfil</text>

    <text class="section" x="20" y="148">FINANCAS</text>
    <rect class="pill-adm" x="20" y="158" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="177" style="font-size:11px">Visao geral</text>
    <rect class="pill-adm" x="194" y="158" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="177" style="font-size:11px">Transacoes</text>
    <rect class="pill-adm" x="20" y="194" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="213" style="font-size:11px">Entradas</text>
    <rect class="pill-adm" x="194" y="194" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="213" style="font-size:11px">Despesas</text>
    <rect class="pill-adm" x="20" y="230" width="340" height="28" rx="7"/>
    <text class="item" x="32" y="249" style="font-size:11px">Controle de caixa</text>

    <text class="section" x="20" y="282">VALIDACAO</text>
    <rect class="pill-adm" x="20" y="292" width="166" height="28" rx="7"/>
    <text class="item" x="28" y="311" style="font-size:10.5px">Pagamentos (dia a dia)</text>
    <rect class="pill-adm" x="194" y="292" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="311" style="font-size:10.5px">Calendario (mensal)</text>

    <text class="section" x="20" y="344">RELATORIOS</text>
    <rect class="pill-adm" x="20" y="354" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="373" style="font-size:11px">Relatorios IA</text>
    <rect class="pill-adm" x="194" y="354" width="166" height="28" rx="7"/>
    <text class="item" x="202" y="373" style="font-size:10.5px">Performance / atividade</text>
  </g>

  <text class="footer" x="28" y="498">Diferenca de perfil na UI e nas rotas ? conteudo financeiro oficial restrito ao admin ? diagrama sem dados sensiveis</text>
</svg>

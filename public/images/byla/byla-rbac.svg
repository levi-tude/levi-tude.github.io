<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Controle de acesso Byla  Admin vs Secretaria</title>
  <desc id="desc">Comparativo de permissões de navegação: secretaria acessa fluxo operacional, aluguel de salas e perfil; admin acessa esses módulos mais finanças, validação, calendário, relatórios e visão geral.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f8fafc; }
      .title { font: 700 18px system-ui, Segoe UI, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 11px system-ui, Segoe UI, sans-serif; fill: #64748b; }
      .col-title { font: 700 14px system-ui, Segoe UI, sans-serif; fill: #ffffff; }
      .col-sub { font: 500 10px system-ui, Segoe UI, sans-serif; fill: #e2e8f0; }
      .section { font: 700 10px system-ui, Segoe UI, sans-serif; fill: #64748b; letter-spacing: 0.04em; }
      .item { font: 600 12px system-ui, Segoe UI, sans-serif; fill: #0f172a; }
      .hint { font: 500 10px system-ui, Segoe UI, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.25; }
      .pill-sec { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; }
      .pill-adm { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1; }
      .pill-shared { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
      .hdr-sec { fill: #14532d; }
      .hdr-adm { fill: #1e3a5f; }
      .footer { font: 500 10px system-ui, Segoe UI, sans-serif; fill: #64748b; }
    ]]></style>
  </defs>

  <rect class="bg" width="840" height="520" rx="12"/>

  <text class="title" x="28" y="34">RBAC por perfil  navegação do app</text>
  <text class="subtitle" x="28" y="52">Baseado em navConfig / rotas protegidas · sem detalhes de token ou política de banco</text>

  <!-- Secretaria column -->
  <g transform="translate(28, 72)">
    <rect width="380" height="400" rx="12" class="card"/>
    <rect width="380" height="56" rx="12" class="hdr-sec"/>
    <rect y="28" width="380" height="28" class="hdr-sec"/>
    <text class="col-title" x="20" y="28">Secretaria</text>
    <text class="col-sub" x="20" y="46">Fluxo operacional do dia a dia</text>

    <text class="section" x="20" y="84">OPERAÇÃO</text>

    <rect class="pill-sec" x="20" y="96" width="340" height="36" rx="8"/>
    <text class="item" x="36" y="119">Fluxo de caixa (operacional)</text>

    <rect class="pill-sec" x="20" y="142" width="340" height="36" rx="8"/>
    <text class="item" x="36" y="165">Aluguel de salas</text>

    <text class="section" x="20" y="206">CONTA</text>

    <rect class="pill-sec" x="20" y="218" width="340" height="36" rx="8"/>
    <text class="item" x="36" y="241">Perfil</text>

    <text class="hint" x="20" y="290">Sem acesso a módulos financeiros,</text>
    <text class="hint" x="20" y="306">validação, calendário, relatórios</text>
    <text class="hint" x="20" y="322">ou visão geral gerencial.</text>

    <rect x="20" y="348" width="340" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="hint" x="36" y="370">Entrada padrão: /fluxo-caixa</text>
  </g>

  <!-- Admin column -->
  <g transform="translate(432, 72)">
    <rect width="380" height="400" rx="12" class="card"/>
    <rect width="380" height="56" rx="12" class="hdr-adm"/>
    <rect y="28" width="380" height="28" class="hdr-adm"/>
    <text class="col-title" x="20" y="28">Admin</text>
    <text class="col-sub" x="20" y="46">Gestão completa + rotas da secretaria</text>

    <text class="section" x="20" y="84">INCLUI SECRETARIA</text>
    <rect class="pill-shared" x="20" y="96" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="115" style="font-size:11px">Fluxo de caixa</text>
    <rect class="pill-shared" x="194" y="96" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="115" style="font-size:11px">Aluguel · Perfil</text>

    <text class="section" x="20" y="148">FINANÇAS</text>
    <rect class="pill-adm" x="20" y="158" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="177" style="font-size:11px">Visão geral</text>
    <rect class="pill-adm" x="194" y="158" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="177" style="font-size:11px">Transações</text>
    <rect class="pill-adm" x="20" y="194" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="213" style="font-size:11px">Entradas</text>
    <rect class="pill-adm" x="194" y="194" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="213" style="font-size:11px">Despesas</text>
    <rect class="pill-adm" x="20" y="230" width="340" height="28" rx="7"/>
    <text class="item" x="32" y="249" style="font-size:11px">Controle de caixa</text>

    <text class="section" x="20" y="282">VALIDAÇÃO</text>
    <rect class="pill-adm" x="20" y="292" width="166" height="28" rx="7"/>
    <text class="item" x="28" y="311" style="font-size:10.5px">Pagamentos (dia a dia)</text>
    <rect class="pill-adm" x="194" y="292" width="166" height="28" rx="7"/>
    <text class="item" x="206" y="311" style="font-size:10.5px">Calendário (mensal)</text>

    <text class="section" x="20" y="344">RELATÓRIOS</text>
    <rect class="pill-adm" x="20" y="354" width="166" height="28" rx="7"/>
    <text class="item" x="32" y="373" style="font-size:11px">Relatórios IA</text>
    <rect class="pill-adm" x="194" y="354" width="166" height="28" rx="7"/>
    <text class="item" x="202" y="373" style="font-size:10.5px">Performance / atividade</text>
  </g>

  <text class="footer" x="28" y="498">Diferença de perfil na UI e nas rotas · conteúdo financeiro restrito ao admin</text>
</svg>
